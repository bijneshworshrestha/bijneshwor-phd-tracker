<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>

      --line: #1c3049;
      --accent: #00d9ff;
      --accent-soft: #0a2d42;
      --accent-glow: rgba(0, 217, 255, 0.35);
      --good: #00e6a8;
      --good-soft: #073527;
      --warn: #ffb800;
      --warn-soft: #3a2a04;
      --muted: #6f88a3;
      --muted-soft: #101c2c;
      --skip: #ff3d63;
      --skip-soft: #3a0f1a;
      --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 0 22px rgba(0,217,255,0.04);
      --shadow-hover: 0 0 0 1px rgba(0,217,255,0.45), 0 0 26px rgba(0,217,255,0.18);

    --ink-soft: #91acc7;
    --paper: #04070c;
    --surface: #0a1220;
    --surface-2: #0f1b2d;
    --line: #1c3049;
    --accent: #00d9ff;
    --accent-soft: #0a2d42;

    --good: #00e6a8;
    --good-soft: #073527;
    --warn: #ffb800;
    --warn-soft: #3a2a04;

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Varela Round', system-ui, sans-serif;
    font-size: 15px;

    margin: 0;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .tabular { font-variant-numeric: tabular-nums; font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .wrap {
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
  }
  @media (max-width: 760px) {

  header.top {

  /* Sidebar nav */

  .company-card.tone-good { border-left-color: var(--good); }

  /* Detail overlay */
  .detail-overlay {

<div class="wrap" id="app">
  <header class="top">
    <div>
      <p class="name">Bijneshwor Shrestha</p>
      <h1>PhD &amp; Scholarship Search</h1>
    </div>
    <div class="meta" id="last-updated"></div>
  </header>
</div>

<div class="detail-overlay" id="detail-overlay">
  <div class="detail-panel" id="detail-panel"></div>
</div>

<script>
const PILLARS = [
  { name: 'North (1990)', note: 'Institutional framework — formal vs. informal constraints, path dependency' },
  { name: 'Tosi & Slocum (1984)', note: 'Contingency theory and managerial control' },
  { name: 'Mintzberg (1979/1983)', note: 'Coordinating mechanisms, organisational configurations' },
  { name: 'Hall & Soskice (2001)', note: 'Varieties of Capitalism, comparative institutional analysis' },
];
const CONSTRAINTS = [
  'DAAD EPOS: ineligible — prior German residency exceeds the 15-month cap',
  'HKPFS: only one lifetime application permitted across all Hong Kong universities',
  'Fulbright Nepal: opens ~Feb 2027 — flag only as deadline approaches',
  'MEXT Japan: opens ~April 2027 — flag only as deadline approaches',
];

const SUPERVISOR_STATUS_DEFS = {
  active_positive: { label: 'Active lead — replied', cls: 'good' },
  awaiting_reply:  { label: 'Sent — awaiting reply', cls: 'warn' },
  identified:      { label: 'Identified — not yet contacted', cls: 'accent' },
  reserve:         { label: 'Reserve', cls: 'muted' },
  declined:        { label: 'Declined', cls: 'skip' },
  archived:        { label: 'Archived', cls: 'muted' },
};
const APP_STATUS_DEFS = {
  'Not Started':       { cls: 'muted' },
  'Applied':           { cls: 'accent' },
  'Awaiting Decision':  { cls: 'warn' },
  'Accepted':          { cls: 'good' },
  'Declined':          { cls: 'skip' },
};

let ALL_ITEMS = [];
let ALL_WATCHLIST = [];
let ALL_SUPERVISORS = [];
const state = { query: '', tierFilter: 'all', sort: 'deadline-asc', page: 'opportunities' };

function switchPage(page) {
  state.page = page;
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.nav === page));
  document.querySelectorAll('[data-page]').forEach(el => {
    el.style.display = el.dataset.page === page ? '' : 'none';
  });
}

function daysUntil(dateStr) {
  const m = /^\d{4}-\d{2}-\d{2}/.exec(dateStr || '');
  if (!m) return null;
  const d = new Date(m[0] + 'T00:00:00Z');
  if (isNaN(d.getTime())) return null;
  const today = new Date();
  const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.round((d.getTime() - todayUTC) / 86400000);
}

function deadlineChip(deadline, status) {
  if (status === 'closed') return `<span class="status-chip chip-muted">Closed</span>`;
  const days = daysUntil(deadline);
  if (days == null) return `<span class="status-chip chip-muted">${escapeHtml(deadline || 'TBD')}</span>`;
  if (days < 0) return `<span class="status-chip chip-muted">Deadline passed</span>`;
  if (days <= 21) return `<span class="status-chip chip-skip">${days}d — ${escapeHtml(deadline)}</span>`;
  if (days <= 60) return `<span class="status-chip chip-warn">${days}d — ${escapeHtml(deadline)}</span>`;
  return `<span class="status-chip chip-good">${escapeHtml(deadline)}</span>`;
}

function tierOf(item) {
  if (item.status === 'closed') return 'closed';
  const r = item.relevance;
  if (r == null) return 'consider';
  if (r >= 50) return 'apply';
  if (r >= 40) return 'consider';
  return 'consider';
}

const TIER_DEFS = [
  { key: 'apply', label: 'Apply', cls: 'good', open: true },
  { key: 'consider', label: 'Consider', cls: 'warn', open: true },
  { key: 'closed', label: 'Closed / deadline passed', cls: 'muted', open: false },
];

function openDetail(id) {
  const p = ALL_ITEMS.find(x => x.id === id);
  if (!p) return;
  const overlay = document.getElementById('detail-overlay');
  const panel = document.getElementById('detail-panel');
  overlay.dataset.openId = id;
  const isScholarship = p.kind === 'scholarship';
  panel.innerHTML = `
    <button type="button" class="detail-close" id="detail-close" aria-label="Close">✕</button>
    <div class="detail-header">
      <p class="dtitle"><span class="kind-chip ${p.kind}">${isScholarship ? 'Scholarship' : 'Position'}</span>${escapeHtml(p.title)}</p>
      <p class="dmeta">${escapeHtml(p.institution)} · ${escapeHtml(p.country || '')}</p>
    </div>
    <div class="detail-badges">
      <div class="score-badge tabular ${badgeCls(p)}">${p.relevance != null ? p.relevance : '—'}</div>
      ${deadlineChip(p.deadline, p.status)}
      <a class="btn-link" href="${escapeAttr(p.url)}" target="_blank" rel="noreferrer">Open source ↗</a>
    </div>
    ${p.fundingNote ? `<div class="note-line">${escapeHtml(p.fundingNote)}</div>` : ''}
    ${p.amount ? `<div class="detail-section"><h3>Funding</h3><div class="detail-pre">${escapeHtml(p.amount)}</div></div>` : ''}
    ${p.eligibility ? `<div class="detail-section"><h3>Eligibility</h3><div class="detail-pre">${escapeHtml(p.eligibility)}</div></div>` : ''}
    ${p.notes ? `<div class="detail-section"><h3>Notes</h3><div class="detail-pre">${escapeHtml(p.notes)}</div></div>` : ''}
    <p class="detail-note">Source: data/opportunities.json, generated by the daily automated scanner into the <a class="btn-link" href="https://claude.ai/code/artifact/0c17f819-0f83-4a8e-a627-f359085cbef8" target="_blank" rel="noreferrer">Claude artifact database</a>. This dashboard is read-only.</p>
  `;
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  overlay.classList.add('open');
}
function closeDetail() {
  const overlay = document.getElementById('detail-overlay');
  overlay.classList.remove('open');
  delete overlay.dataset.openId;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });
document.getElementById('detail-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'detail-overlay') closeDetail();
});

function badgeCls(p) {
  if (p.status === 'closed') return 'muted';
  const r = p.relevance;
  if (r == null) return 'muted';
  if (r >= 50) return 'good';
  if (r >= 40) return 'warn';
  return 'skip';
}

async function render() {
  const wrap = document.getElementById('app');

  let data;
  try {
    const res = await fetch('data/opportunities.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    const box = document.createElement('div');
    box.id = 'load-error';
    box.textContent = 'Could not load data/opportunities.json (' + err.message + ').';
    wrap.appendChild(box);
    return;
  }

  const positions = (data.positions || []).map(p => ({ ...p, kind: 'position' }));
  const scholarships = (data.scholarships || []).map(s => ({ ...s, kind: 'scholarship', title: s.name, institution: s.provider }));
  ALL_ITEMS = positions.concat(scholarships);
  ALL_WATCHLIST = data.watchlist || [];
  ALL_SUPERVISORS = data.supervisors || [];

  document.getElementById('last-updated').textContent =
    'Updated ' + (data.metadata && data.metadata.lastUpdated ? data.metadata.lastUpdated : '—');

  const counts = { all: ALL_ITEMS.length, apply: 0, consider: 0, closed: 0 };
  ALL_ITEMS.forEach(p => { counts[tierOf(p)] = (counts[tierOf(p)] || 0) + 1; });

  const statsBar = document.createElement('div');
  statsBar.className = 'stats-bar';
  statsBar.dataset.page = 'opportunities';
  const statDefs = [
    { key: 'all', label: 'All opportunities', cls: 'accent' },
    { key: 'apply', label: 'Apply', cls: 'good' },
    { key: 'consider', label: 'Consider', cls: 'warn' },
    { key: 'closed', label: 'Closed', cls: 'muted' },
    { key: 'watchlist', label: 'Watchlist', cls: 'muted', count: ALL_WATCHLIST.length },
  ];
  statDefs.forEach(sd => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'stat-tile c-' + sd.cls + (sd.key === 'all' ? ' active' : '');
    btn.dataset.tier = sd.key;
    const n = sd.count != null ? sd.count : (counts[sd.key] || 0);
    btn.innerHTML = `<div class="n tabular">${n}</div><div class="l">${escapeHtml(sd.label)}</div>`;
    btn.addEventListener('click', () => {
      if (sd.key === 'watchlist') { document.getElementById('watchlist-section').scrollIntoView({ behavior: 'smooth' }); return; }
      state.tierFilter = sd.key;
      document.querySelectorAll('.stat-tile').forEach(t => t.classList.toggle('active', t.dataset.tier === sd.key));
      applyFilters();
    });
    statsBar.appendChild(btn);
  });
  wrap.appendChild(statsBar);

  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.dataset.page = 'opportunities';
  controls.innerHTML = `
    <input type="search" id="search-box" placeholder="Search title, institution, country…" aria-label="Search opportunities">
    <select id="sort-select" aria-label="Sort opportunities">
      <option value="deadline-asc">Deadline: soonest first</option>
      <option value="score-desc">Relevance: high to low</option>
      <option value="institution">Institution A–Z</option>
    </select>
    <span class="result-count" id="result-count"></span>
  `;
  wrap.appendChild(controls);

  const aside = document.createElement('aside');

  const navPanel = document.createElement('div');
  navPanel.className = 'panel nav-panel';
  const navLinks = [
    { key: 'opportunities', label: 'Opportunities', count: ALL_ITEMS.length },
    { key: 'supervisors', label: 'Supervisors', count: ALL_SUPERVISORS.length },
    { key: 'applications', label: 'Applications', count: ALL_ITEMS.length },
  ];
  navLinks.forEach(nl => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'nav-link' + (nl.key === state.page ? ' active' : '');
    btn.dataset.nav = nl.key;
    btn.innerHTML = `<span>${escapeHtml(nl.label)}</span><span class="nav-count tabular">${nl.count}</span>`;
    btn.addEventListener('click', () => switchPage(nl.key));
    navPanel.appendChild(btn);
  });
  aside.appendChild(navPanel);

  const pillarsPanel = document.createElement('div');
  pillarsPanel.className = 'panel';
  pillarsPanel.dataset.page = 'opportunities';
  pillarsPanel.innerHTML = '<h2>Theoretical pillars</h2>';
  PILLARS.forEach(p => {
    const row = document.createElement('div');
    row.className = 'pillar-row';
    row.innerHTML = `<div class="p-name">${escapeHtml(p.name)}</div><div class="p-note">${escapeHtml(p.note)}</div>`;
    pillarsPanel.appendChild(row);
  });
  aside.appendChild(pillarsPanel);

  const constraintsPanel = document.createElement('div');
  constraintsPanel.className = 'panel';
  constraintsPanel.dataset.page = 'opportunities';
  constraintsPanel.innerHTML = '<h2>Key constraints</h2>';
  CONSTRAINTS.forEach(c => {
    const box = document.createElement('div');
    box.className = 'rule-box';
    box.textContent = c;
    constraintsPanel.appendChild(box);
  });
  aside.appendChild(constraintsPanel);
  wrap.appendChild(aside);

  const main = document.createElement('main');
  main.dataset.page = 'opportunities';
  TIER_DEFS.forEach(td => {
    const details = document.createElement('details');
    details.className = 'tier-section';
    details.dataset.tier = td.key;
    if (td.open) details.open = true;
    details.innerHTML = `
      <summary>
        <span class="chevron"></span>
        <span class="dot ${td.cls}"></span>
        <span>${escapeHtml(td.label)}</span>
        <span class="count tabular" data-role="count"></span>
        <span class="dash"></span>
      </summary>
      <div class="posting-list" data-role="list"></div>
    `;
    main.appendChild(details);
  });

  const watchlistSection = document.createElement('section');
  watchlistSection.className = 'tier-section';
  watchlistSection.id = 'watchlist-section';
  watchlistSection.innerHTML = `<h2 style="display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 10px;font-weight:600;">Watchlist — future cycles, not yet actionable <span class="count tabular" style="font-size:12px;color:var(--muted);font-weight:500;">${ALL_WATCHLIST.length}</span><span class="dash" style="flex:1;height:1px;background:var(--line);"></span></h2>`;
  const watchGrid = document.createElement('div');
  watchGrid.className = 'companies-grid';
  ALL_WATCHLIST.forEach(w => {
    const card = document.createElement('div');
    card.className = 'company-card';
    card.innerHTML = `
      <div class="cname">${escapeHtml(w.institution)}</div>
      <div class="cmeta">${escapeHtml(w.note)}</div>
      ${w.url ? `<a class="view" href="${escapeAttr(w.url)}" target="_blank" rel="noreferrer">source →</a>` : ''}
    `;
    watchGrid.appendChild(card);
  });
  watchlistSection.appendChild(watchGrid);
  main.appendChild(watchlistSection);

  wrap.appendChild(main);

  // ---- Supervisors page ----
  const supervisorsSection = document.createElement('main');
  supervisorsSection.dataset.page = 'supervisors';
  supervisorsSection.style.display = 'none';
  const SUP_GROUP_ORDER = ['active_positive', 'awaiting_reply', 'identified', 'reserve', 'declined', 'archived'];
  const SUP_GROUP_LABELS = {
    active_positive: 'Active leads — replied',
    awaiting_reply: 'Sent — awaiting reply',
    identified: 'Identified — not yet contacted',
    reserve: 'Reserve',
    declined: 'Declined',
    archived: 'Archived — do not contact',
  };
  SUP_GROUP_ORDER.forEach(statusKey => {
    const group = ALL_SUPERVISORS.filter(s => s.status === statusKey);
    if (!group.length) return;
    const sd = SUPERVISOR_STATUS_DEFS[statusKey] || { label: statusKey, cls: 'muted' };
    const section = document.createElement('section');
    section.className = 'tier-section';
    section.innerHTML = `<h2 style="display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 10px;font-weight:600;">${escapeHtml(SUP_GROUP_LABELS[statusKey])} <span class="count tabular" style="font-size:12px;color:var(--muted);font-weight:500;">${group.length}</span><span class="dash" style="flex:1;height:1px;background:var(--line);"></span></h2>`;
    const grid = document.createElement('div');
    grid.className = 'companies-grid';
    group.forEach(s => {
      const linked = s.linkedOpportunity ? ALL_ITEMS.find(x => x.id === s.linkedOpportunity) : null;
      const card = document.createElement('div');
      card.className = 'company-card tone-' + sd.cls;
      card.innerHTML = `
        <div class="cname">${escapeHtml(s.name)}</div>
        <div class="cmeta">${escapeHtml(s.institution || '')}${s.country ? ' · ' + escapeHtml(s.country) : ''}</div>
        ${s.lastAction ? `<div class="cmeta" style="margin-top:2px;">Last action: ${escapeHtml(s.lastAction)}</div>` : ''}
        ${s.notes ? `<div class="note-line">${escapeHtml(s.notes)}</div>` : ''}
        ${linked ? `<div class="cmeta" style="margin-top:6px;">Linked: ${escapeHtml(linked.title)}</div>` : ''}
        ${s.email ? `<a class="view" href="mailto:${escapeAttr(s.email)}">${escapeHtml(s.email)}</a>` : ''}
      `;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    supervisorsSection.appendChild(section);
  });
  wrap.appendChild(supervisorsSection);

  // ---- Applications page ----
  const applicationsSection = document.createElement('main');
  applicationsSection.dataset.page = 'applications';
  applicationsSection.style.display = 'none';
  const appSection = document.createElement('section');
  appSection.className = 'tier-section';
  appSection.innerHTML = `<h2 style="display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 10px;font-weight:600;">All opportunities — application status <span class="count tabular" style="font-size:12px;color:var(--muted);font-weight:500;">${ALL_ITEMS.length}</span><span class="dash" style="flex:1;height:1px;background:var(--line);"></span></h2>`;
  const appList = document.createElement('div');
  appList.className = 'posting-list';
  sortItems(ALL_ITEMS.slice(), 'deadline-asc').forEach(p => {
    const appStatus = p.applicationStatus || 'Not Started';
    const asd = APP_STATUS_DEFS[appStatus] || { cls: 'muted' };
    const row = document.createElement('div');
    row.className = 'posting tone-' + badgeCls(p);
    row.innerHTML = `
      <div class="score-badge tabular ${badgeCls(p)}">${p.relevance != null ? p.relevance : '—'}</div>
      <div>
        <div class="title"><span class="kind-chip ${p.kind}">${p.kind === 'scholarship' ? 'Scholarship' : 'Position'}</span>${escapeHtml(p.title)}</div>
        <div class="sub">${escapeHtml(p.institution)} <span class="src">· deadline ${escapeHtml(p.deadline || 'TBD')}</span></div>
      </div>
      <span class="status-chip chip-${asd.cls}">${escapeHtml(appStatus)}</span>
      <a class="view" href="${escapeAttr(p.url)}" target="_blank" rel="noreferrer">View →</a>
    `;
    appList.appendChild(row);
  });
  appSection.appendChild(appList);
  applicationsSection.appendChild(appSection);
  wrap.appendChild(applicationsSection);

  const footer = document.createElement('footer');
  footer.innerHTML = `
    <span>View-only — the scanner and scoring run in a Claude conversation, not from this page.</span>
    <span>Data: <span class="mono">data/opportunities.json</span>, generated from the <a href="https://claude.ai/code/artifact/0c17f819-0f83-4a8e-a627-f359085cbef8" target="_blank" rel="noreferrer">artifact database</a>.</span>
  `;
  wrap.appendChild(footer);

  document.getElementById('search-box').addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    applyFilters();
  });
  document.getElementById('sort-select').addEventListener('change', (e) => {
    state.sort = e.target.value;
    applyFilters();
  });

  applyFilters();
  switchPage(state.page);
}

function applyFilters() {
  const q = state.query;
  let visibleTotal = 0;

  TIER_DEFS.forEach(td => {
    const section = document.querySelector(`details.tier-section[data-tier="${td.key}"]`);
    if (!section) return;

    const matchesTierFilter = state.tierFilter === 'all' || state.tierFilter === td.key;
    section.style.display = matchesTierFilter ? '' : 'none';
    if (!matchesTierFilter) return;

    let items = ALL_ITEMS.filter(p => tierOf(p) === td.key);
    if (q) {
      items = items.filter(p =>
        (p.title || '').toLowerCase().includes(q) ||
        (p.institution || '').toLowerCase().includes(q) ||
        (p.country || '').toLowerCase().includes(q)
      );
    }
    items = sortItems(items, state.sort);
    visibleTotal += items.length;

    section.querySelector('[data-role="count"]').textContent = items.length;
    const list = section.querySelector('[data-role="list"]');
    list.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = q ? 'no-match' : 'empty-tier';
      empty.textContent = q ? 'No opportunities in this tier match your search.' : 'Nothing here right now.';
      list.appendChild(empty);
      return;
    }

    items.forEach(p => {
      const row = document.createElement('div');
      const cls = badgeCls(p);
      row.className = 'posting tone-' + cls;
      row.dataset.id = p.id;
      row.innerHTML = `
        <div class="score-badge tabular ${cls}">${p.relevance != null ? p.relevance : '—'}</div>
        <div>
          <div class="title"><span class="kind-chip ${p.kind}">${p.kind === 'scholarship' ? 'Scholarship' : 'Position'}</span>${escapeHtml(p.title)}</div>
          <div class="sub">${escapeHtml(p.institution)} <span class="src">· ${escapeHtml(p.country || '')}</span></div>
        </div>
        ${deadlineChip(p.deadline, p.status)}
        <a class="view" href="${escapeAttr(p.url)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">View →</a>
      `;
      row.addEventListener('click', () => openDetail(p.id));
      list.appendChild(row);
    });
  });

  const resultCount = document.getElementById('result-count');
  if (resultCount) {
    resultCount.textContent = q || state.tierFilter !== 'all'
      ? `${visibleTotal} of ${ALL_ITEMS.length} shown`
      : `${ALL_ITEMS.length} total`;
  }
}

function sortItems(items, sort) {
  const copy = items.slice();
  switch (sort) {
    case 'score-desc':
      return copy.sort((a, b) => (b.relevance ?? -1) - (a.relevance ?? -1));
    case 'institution':
      return copy.sort((a, b) => (a.institution || '').localeCompare(b.institution || ''));
    case 'deadline-asc':
    default:
      return copy.sort((a, b) => {
        const da = daysUntil(a.deadline); const db = daysUntil(b.deadline);
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      });
  }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

render();
</script>

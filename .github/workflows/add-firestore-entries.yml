              "notes": "Highest fit of 2026-09-12 scan. Imagery rescripting in panic disorder. Prof. Engelhard is a leading EMDR/imagery rescripting researcher. Start: late Nov 2026. Added by daily scanner 2026-09-12.",
              "tags": ["Netherlands", "clinical", "panic-disorder", "imagery-rescripting", "psychotherapy", "salaried", "scanner-2026-09-12"],
          })
 
          add("positions", "pos-imprs-munich-01", {
              "id": "pos-imprs-munich-01",
              "title": "PhD: Fully Funded Translational Psychiatry — IMPRS-TP (Max Planck Munich)",
              "university": "International Max Planck Research School for Translational Psychiatry (IMPRS-TP)",
              "country": "Germany",
              "supervisor": "TBD — chosen after admission",
              "funding": "Fully funded — stipend + no tuition (competitive German rate)",
              "deadline": "2026-10-31",
              "relevance": 55,
              "status": "open",
              "source": "scanner",
              "url": "https://www.imprs-tp.mpg.de/",
              "notes": "Applications open Aug 15 2026. References due Nov 7. Covers molecular psychiatry, neuroimaging, computational neuroscience. Prestigious programme; best fit if neuropsychology interest exists. Added by daily scanner 2026-09-12.",
              "tags": ["Germany", "translational-psychiatry", "neuroimaging", "Max-Planck", "stipend", "scanner-2026-09-12"],
          })
 
          add("positions", "pos-antwerp-01", {
              "id": "pos-antwerp-01",
              "title": "PhD Scholarship: Well-being in Legal Professions (Criminal Law)",

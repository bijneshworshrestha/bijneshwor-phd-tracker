name: Add Firestore Entries (One-off)
 
on:
  workflow_dispatch:  # Manual trigger only — run from Actions tab
 
jobs:
  add-entries:
    runs-on: ubuntu-latest
    steps:
      - name: Install requests
        run: pip install requests
 
      - name: Add entries to Firestore
        run: |
          python3 << 'EOF'
          import requests
 
          BASE = "https://firestore.googleapis.com/v1/projects/kanchan-phd-and-grant-hunt/databases/(default)/documents"
 
          def add(collection, doc_id, data):
              fields = {}
              for k, v in data.items():
                  if isinstance(v, str):
                      fields[k] = {"stringValue": v}
                  elif isinstance(v, int):
                      fields[k] = {"integerValue": str(v)}
                  elif isinstance(v, list):
                      fields[k] = {"arrayValue": {"values": [{"stringValue": x} for x in v]}}
              r = requests.patch(f"{BASE}/{collection}/{doc_id}", json={"fields": fields})
              status = "✅" if r.status_code in (200, 201) else f"❌ {r.status_code}"
              print(f"{status}  {collection}/{doc_id}")
 
          # ── POSITIONS ──────────────────────────────────────────────
          add("positions", "pos-utrecht-clin-01", {
              "id": "pos-utrecht-clin-01",
              "title": "PhD: Freeze-Fight-Flight Dynamics in Mental Health Care",
              "university": "Utrecht University",
              "country": "Netherlands",
              "supervisor": "Dr. Muriel Hagenaars",
              "funding": "Salaried — CAO NU Scale P (~EUR 3,204–4,051/month gross)",
              "deadline": "2026-09-27",
              "relevance": 80,
              "status": "open",
              "source": "scanner",
              "url": "https://www.applykite.com/positions/phd-in-freeze-fight-flight-dynamics-in-mental-health-care-2xg4ijq3vc",
              "notes": "URGENT — deadline Sept 27. Personality disorders; freeze response in daily life and treatment. Longitudinal EMA + intervention testing. ~10% teaching. Added by daily scanner 2026-09-12.",
              "tags": ["Netherlands", "clinical", "personality-disorders", "EMA", "salaried", "scanner-2026-09-12"],
          })
 
          add("positions", "pos-maastricht-clin-01", {
              "id": "pos-maastricht-clin-01",
              "title": "PhD: Reducing Avoidance via Threat Imagery in Panic Disorder",
              "university": "Maastricht University",
              "country": "Netherlands",
              "supervisor": "Prof. Dr. Iris Engelhard; Dr. Pauline Dibbets",
              "funding": "Salaried — 0.8 FTE, 1-year initial extendable to 4 years (~EUR 3,204–4,051/month)",

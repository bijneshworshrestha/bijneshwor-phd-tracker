          })
 
          # ── CONFERENCES ────────────────────────────────────────────
          add("conferences", "conf-eaclipt-2027", {
              "id": "conf-eaclipt-2027",
              "title": "EACLIPT 2027 — Shaping the Future of Mental Health",
